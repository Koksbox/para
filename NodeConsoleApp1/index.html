<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DOM Калькулятор</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="bg-grid" aria-hidden="true"></div>

  <main class="app">
    <header class="header">
      <p class="eyebrow">изучаем DOM</p>
      <h1>Калькулятор</h1>
      <p class="subtitle">Два числа · пять операций · результат в DOM</p>
    </header>

    <section class="panel" aria-label="Калькулятор">
      <div class="fields">
        <label class="field">
          <span>Первое число</span>
          <input id="numA" type="text" inputmode="decimal" autocomplete="off" placeholder="например 12.5" />
        </label>

        <label class="field">
          <span>Второе число</span>
          <input id="numB" type="text" inputmode="decimal" autocomplete="off" placeholder="например 3" />
        </label>
      </div>

      <div class="ops" id="ops" role="group" aria-label="Операции">
        <button type="button" class="op-btn" data-op="+">+</button>
        <button type="button" class="op-btn" data-op="-">−</button>
        <button type="button" class="op-btn" data-op="*">×</button>
        <button type="button" class="op-btn" data-op="/">÷</button>
        <button type="button" class="op-btn" data-op="^">xʸ</button>
      </div>

      <p id="error" class="error" hidden></p>

      <div class="result-block">
        <p class="result-label">Результат</p>
        <p id="expression" class="expression">—</p>
        <p id="result" class="result">0</p>
      </div>

      <div class="actions">
        <button type="button" id="clearBtn" class="ghost-btn">Очистить</button>
      </div>
    </section>

    <section class="history-panel" aria-label="История">
      <div class="history-head">
        <h2>История</h2>
        <button type="button" id="clearHistoryBtn" class="ghost-btn small">Сбросить</button>
      </div>
      <ul id="history" class="history"></ul>
    </section>
  </main>

  <script src="calculator.js"></script>
</body>
</html>
